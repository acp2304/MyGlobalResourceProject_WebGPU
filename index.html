<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Globo WebGPU</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      background: #0b1021;
      color: #e7ecf7;
    }

    canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    .ui-panel {
      position: fixed;
      top: 1rem;
      left: 1rem;
      padding: 1rem;
      background: rgba(15, 18, 36, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      backdrop-filter: blur(6px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
      min-width: 260px;
    }

    .ui-panel h1 {
      margin: 0 0 0.5rem;
      font-size: 1.1rem;
      letter-spacing: 0.01em;
    }

    .ui-panel p {
      margin: 0 0 0.75rem;
      font-size: 0.9rem;
      color: #c7cee1;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 600;
      font-size: 0.85rem;
    }

    select, input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 0.55rem 0.65rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.04);
      color: #e7ecf7;
      font-size: 0.95rem;
      margin-bottom: 0.6rem;
      outline: none;
    }

    button {
      cursor: pointer;
      border: none;
      background: linear-gradient(135deg, #3b82f6, #22d3ee);
      color: #0b1021;
      font-weight: 700;
      transition: transform 0.1s ease, filter 0.15s ease;
    }

    button:hover {
      filter: brightness(1.05);
    }

    button:active {
      transform: translateY(1px);
    }

    .coords {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
    }

    small {
      color: #9ca6c2;
      display: block;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>
  <canvas id="gpu-canvas"></canvas>

  <div class="ui-panel">
    <h1>Selecciona un país</h1>
    <p>Resalta una zona del globo por país o coordenadas (lat, lon).</p>

    <label for="country-select">País rápido</label>
    <select id="country-select"></select>

    <label>Coordenadas manuales</label>
    <div class="coords">
      <input id="lat-input" type="number" placeholder="Latitud" step="0.01" />
      <input id="lon-input" type="number" placeholder="Longitud" step="0.01" />
    </div>
    <button id="select-coordinates">Resaltar coordenadas</button>
    <small>Actual: <span id="current-selection">sin país activo</span></small>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
